<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="AI Doctor Agent - Your intelligent health management partner" />
    <meta name="keywords" content="AI, health, medical, doctor, assistant, diet analysis, health records" />
    <meta name="author" content="AI Doctor Team" />
    
    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1890ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AI Doctor" />
    
    <!-- Mobile Optimization -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>

    <!-- Mobile Debug Console -->
    <script>
      // 检测移动设备
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      
      if (isMobile) {
        // 创建移动端调试面板
        const debugPanel = document.createElement('div');
        debugPanel.id = 'mobile-debug-panel';
        debugPanel.style.cssText = `
          position: fixed;
          top: 10px;
          right: 10px;
          width: 300px;
          max-height: 400px;
          background: rgba(0,0,0,0.8);
          color: white;
          font-family: monospace;
          font-size: 12px;
          padding: 10px;
          border-radius: 5px;
          z-index: 9999;
          overflow-y: auto;
          display: none;
        `;
        
        const toggleBtn = document.createElement('button');
        toggleBtn.textContent = '🐛';
        toggleBtn.style.cssText = `
          position: fixed;
          top: 10px;
          right: 10px;
          width: 40px;
          height: 40px;
          background: #1890ff;
          color: white;
          border: none;
          border-radius: 50%;
          font-size: 20px;
          z-index: 10000;
          cursor: pointer;
        `;
        
        let logs = [];
        const maxLogs = 50;
        
        // 重写console.log
        const originalLog = console.log;
        console.log = function(...args) {
          originalLog.apply(console, args);
          logs.push({
            type: 'log',
            message: args.join(' '),
            time: new Date().toLocaleTimeString()
          });
          if (logs.length > maxLogs) logs.shift();
          updateDebugPanel();
        };
        
        // 重写console.error
        const originalError = console.error;
        console.error = function(...args) {
          originalError.apply(console, args);
          logs.push({
            type: 'error',
            message: args.join(' '),
            time: new Date().toLocaleTimeString()
          });
          if (logs.length > maxLogs) logs.shift();
          updateDebugPanel();
        };
        
        function updateDebugPanel() {
          if (debugPanel.style.display === 'block') {
            debugPanel.innerHTML = logs.map(log => 
              `<div style="color: ${log.type === 'error' ? '#ff4d4f' : '#52c41a'}; margin: 2px 0;">
                [${log.time}] ${log.message}
              </div>`
            ).join('');
          }
        }
        
        toggleBtn.onclick = function() {
          if (debugPanel.style.display === 'none') {
            debugPanel.style.display = 'block';
            updateDebugPanel();
          } else {
            debugPanel.style.display = 'none';
          }
        };
        
        document.body.appendChild(debugPanel);
        document.body.appendChild(toggleBtn);
        
        // 添加一些初始日志
        console.log('📱 Mobile debug console initialized');
        console.log('🌐 User Agent:', navigator.userAgent);
        console.log('📏 Screen size:', window.innerWidth + 'x' + window.innerHeight);
      }
    </script>
    
    <title>AI Doctor Agent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/frontend/main.tsx"></script>
  </body>
</html>
